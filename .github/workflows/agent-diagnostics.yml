name: Mac issue diagnostics
run-name: Diagnose ${{ inputs.request_id }} at ${{ inputs.revision }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique investigation ID
        required: true
        type: string
      revision:
        description: Exact committed revision to reproduce or retest
        required: true
        type: string
      issue:
        description: Reported issue; agent must inspect returned evidence
        required: true
        type: string
      scenario:
        description: Optional protocol-1 custom scenario JSON
        required: false
        default: ''
        type: string
      aircraft_type:
        description: Optional affected type, e.g. DH8D
        required: false
        default: ''
        type: string
permissions:
  contents: read
# The single dedicated runner serialises jobs. A concurrency group would cancel
# older pending requests when several agents dispatch; retain every request instead.
jobs:
  reproduce:
    if: github.repository == 'Bazlinka/Airside' && github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, airside-diagnostics]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          clean: false
          fetch-depth: 1
      - name: Execute validated request in isolated runner checkout
        env:
          DIAGNOSTIC_ID: ${{ inputs.request_id }}
          DIAGNOSTIC_REVISION: ${{ inputs.revision }}
          DIAGNOSTIC_ISSUE: ${{ inputs.issue }}
          DIAGNOSTIC_SCENARIO: ${{ inputs.scenario }}
          DIAGNOSTIC_AIRCRAFT: ${{ inputs.aircraft_type }}
        run: python3 scripts/diagnose-game.py --execute-request
      - name: Upload actual evidence, including failed builds/runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-diagnostics-${{ inputs.request_id }}
          path: |
            work/issue-diagnostics/
            work/mac-build.log
          if-no-files-found: error
          retention-days: 14
