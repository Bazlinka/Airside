name: Headless checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generated data files are current
        run: |
          python3 scripts/generate-ypad-roads.py --check
          python3 scripts/generate-ypad-carparks.py --check
          python3 scripts/generate-ypad-precinct.py --check
      - name: No buildings without a street
        run: python3 scripts/audit-ypad-map.py --max-percent 0.5
      - name: Harness list is current
        run: python3 scripts/update-harness.py --check
      - name: Aircraft doors sit on their hulls
        run: python3 scripts/fit-aircraft-doors.py audit
      - name: Bell tail rotor geometry and packaged mirrors
        run: python3 scripts/test-bell-tail-rotor.py
      - name: Capture soak outlives long review delays
        run: bash scripts/test-capture-game-soak-window.sh
      - name: Capture resume keeps good PNGs
        run: bash scripts/test-capture-game-resume.sh
      - name: P0 remaining capture delays stay locked
        run: bash scripts/test-p0-remaining-delays.sh
      - name: P0 Stage B dirty RESULTS allowlist
        run: bash scripts/test-p0-remaining-dirty-allowlist.sh
      - name: P0 Stage A/B/C ONLY filter
        run: bash scripts/test-p0-remaining-only-filter.sh
      - name: P0 one-paste Stage A→B→C chain
        run: bash scripts/test-p0-stages-chain.sh
      - name: P0 Mac CreateAgent launcher lock
        run: bash scripts/test-p0-mac-agent-launch.sh
      - name: Tests compile against Unity's NUnit 3.5 without implicit usings
        run: bash scripts/check-unity-nunit.sh
      - name: Domain, Simulation and Unity-free Presentation tests
        run: dotnet test scripts/dotnet-harness/Harness.csproj --nologo
