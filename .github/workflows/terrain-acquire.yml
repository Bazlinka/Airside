name: Temporary Australia terrain acquisition
on:
  pull_request:
    paths:
      - '.github/workflows/terrain-acquire.yml'
      - 'scripts/generate-australia-flight-world.py'
permissions:
  contents: write
  actions: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow rasterio
      - name: Acquire previously verified real approach grids
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37732831774 -n australian-airport-approach-grids -D work/acquired
          python - <<'PYCODE'
          import shutil
          from pathlib import Path
          for file in Path('work/acquired').rglob('*_approach_*_v01.bin'):
              for root in ('game/Airside/Assets/Airside/Art/Terrain', 'game/Airside/Assets/StreamingAssets/Airside/Art/Terrain'):
                  shutil.copyfile(file, Path(root) / file.name)
          for file in Path('work/acquired').rglob('australia-flight-world-airports-v01.json'):
              shutil.copyfile(file, Path('docs/data') / file.name)
          PYCODE
      - name: Bake real Australian cruise and airport map data
        run: |
          python scripts/generate-australia-flight-world.py cruise
          python scripts/generate-australia-flight-world.py osm
      - name: Check offline data and packaged mirrors
        run: python scripts/check-australia-flight-data.py
      - name: Commit acquired map data to this task branch
        run: |
          git config user.name 'Airside terrain acquisition'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/Airside/Assets/Airside/Art/Terrain/dem_australia_v01.bin game/Airside/Assets/Airside/Art/Terrain/landcover_australia_v01.bin
          git add game/Airside/Assets/Airside/Art/Terrain/dem_approach_*_v01.bin game/Airside/Assets/Airside/Art/Terrain/landcover_approach_*_v01.bin game/Airside/Assets/Airside/Art/Terrain/airport_*_v01.json
          git add game/Airside/Assets/StreamingAssets/Airside/Art/Terrain/dem_australia_v01.bin game/Airside/Assets/StreamingAssets/Airside/Art/Terrain/landcover_australia_v01.bin
          git add game/Airside/Assets/StreamingAssets/Airside/Art/Terrain/dem_approach_*_v01.bin game/Airside/Assets/StreamingAssets/Airside/Art/Terrain/landcover_approach_*_v01.bin game/Airside/Assets/StreamingAssets/Airside/Art/Terrain/airport_*_v01.json
          git add docs/data/australia-flight-world-*-v01.json
          git diff --cached --quiet || git commit -m 'Acquire verified Australian terrain and airport datasets'
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: australian-airport-approach-grids
          path: |
            game/Airside/Assets/Airside/Art/Terrain/dem_approach_*_v01.bin
            game/Airside/Assets/Airside/Art/Terrain/landcover_approach_*_v01.bin
            docs/data/australia-flight-world-*-v01.json
          if-no-files-found: error
          retention-days: 2
