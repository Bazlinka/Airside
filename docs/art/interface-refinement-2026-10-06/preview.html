.airport-tag{position:fixed;left:104px;top:109px;font-size:11px;letter-spacing:1.5px;color:#f5f4ea;text-shadow:0 1px 8px #17242a}.airport-tag b{font-weight:normal;opacity:.65;margin-left:14px}.context{position:fixed;right:20px;bottom:24px;display:flex;align-items:center;gap:4px;padding:8px}.context button{padding:10px 13px;border-radius:6px;color:var(--muted);font-size:12px}.context .active{color:var(--text);background:#ffffff12}
.drawer{position:fixed;right:20px;top:104px;width:328px;padding:23px;max-height:calc(100vh - 200px);overflow:auto}.drawer{display:flex;flex-direction:column;overflow:hidden}.drawer-body{overflow:auto;min-height:0;padding-right:2px}.drawer-footer{flex-shrink:0;padding-top:14px;border-top:1px solid var(--line)}.drawer-head{flex-shrink:0;display:flex;justify-content:space-between;align-items:flex-start}.close{color:var(--muted);padding:0 2px;font-size:23px;border-radius:4px}.drawer h1{font-size:27px;font-weight:normal;letter-spacing:-1px;margin:7px 0 5px}.sub{color:var(--muted);font-size:12px;line-height:1.6}.status{margin:24px 0 20px;padding-bottom:20px;border-bottom:1px solid var(--line)}.status-title{font-size:17px;display:flex;align-items:center;gap:8px}.dot{width:6px;height:6px;background:var(--accent);border-radius:50%;display:inline-block}.status p{color:var(--muted);line-height:1.6;font-size:12px;margin:9px 0 0}.details{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}.details strong{display:block;font-size:13px;font-weight:normal;margin-top:7px}.timeline{margin:24px 0 20px;padding:0;list-style:none}.timeline li{position:relative;padding:0 0 17px 24px;font-size:12px;color:var(--muted)}.timeline li:before{content:'';position:absolute;left:0;top:3px;width:7px;height:7px;border:1px solid #a4afb655;border-radius:50%;background:var(--ink)}.timeline li:after{content:'';position:absolute;left:3px;top:13px;width:1px;height:15px;background:var(--line)}.timeline li:last-child:after{display:none}.timeline li.done:before{background:var(--green);border-color:var(--green)}.timeline li.current{color:var(--text)}.timeline li.current:before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px #9fc8c51a}.timeline small{display:block;color:var(--muted);margin-top:5px;font-size:11px}.primary{width:100%;padding:13px 16px;background:var(--gold);color:var(--ink);font-weight:bold;font-size:12px;border-radius:7px}.primary:hover{background:#e7cc97}.secondary{display:block;width:100%;margin-top:9px;padding:11px;border-radius:7px;color:var(--muted);font-size:12px}.progress{height:3px;background:#ffffff12;margin:15px 0;border-radius:3px}.progress i{display:block;height:100%;width:42%;background:var(--accent)}
.workspace{position:fixed;left:104px;top:104px;right:20px;bottom:96px;padding:30px;overflow:auto}.workspace h1{font-size:30px;font-weight:normal;letter-spacing:-.8px;margin:8px 0}.workspace-header{display:flex;justify-content:space-between;align-items:start}.workspace-header .sub{margin-top:10px}.workspace .close{margin-top:2px}.filters{display:flex;gap:8px;margin:26px 0 22px}.filters button{padding:9px 14px;border-radius:6px;color:var(--muted);font-size:12px}.filters .active{color:var(--text);background:#ffffff0d}.table{width:100%;border-collapse:collapse;text-align:left}.table th{color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:normal;padding:13px 12px;border-bottom:1px solid var(--line)}.table td{padding:23px 12px;border-bottom:1px solid var(--line);font-size:13px}.table td:first-child{padding-left:0}.table td strong{display:block;font-size:15px;font-weight:normal;margin-bottom:6px}.table td small{font-size:11px;color:var(--muted)}.table tr.selected{background:#9fc8c508}.table button{border:1px solid #9fc8c533;border-radius:6px;padding:9px 14px;color:var(--accent);font-size:12px}.table .ok{color:var(--green)}.table .caution{color:var(--gold)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px}.contract{border-top:1px solid var(--line);padding-top:22px}.contract h2{font-size:20px;font-weight:normal;margin:10px 0}.contract p{font-size:13px;color:var(--muted);line-height:1.7}.contract .primary{margin-top:20px}.notice{position:fixed;left:104px;top:146px;padding:10px 14px;border-radius:7px;background:#121b22d9;color:var(--muted);font-size:11px;max-width:400px}.design-label{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);color:#f2f0e8a0;font-size:9px;letter-spacing:1px;pointer-events:none}

@media(max-height:780px){.timeline li{display:none}.timeline li.current,.timeline li.current+li{display:block}.timeline:before{content:"Movement progress";display:block;color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}.timeline{margin:20px 0 8px}.timeline li.current+li:after{display:none}}

<script>
const icons={Operations:'M3 5h14M3 10h14M3 15h9',Map:'M2 4l5-2 6 2 5-2v14l-5 2-6-2-5 2zM7 2v14M13 4v14',Fleet:'M10 2v16M10 7L2 12v2l8-3 8 3v-2zM6 18l4-2 4 2',Contracts:'M5 3h10v15H5zM8 7h4M8 11h4M8 15h2',Career:'M3 17V12h3v5M9 17V8h3v9M15 17V3h3v14',Settings:'M10 6a4 4 0 1 0 0 8 4 4 0 1 0 0-8M10 2v2M10 16v2M2 10h2M16 10h2'};
const nav=document.querySelector('nav');nav.innerHTML=Object.entries(icons).map(([name,path],i)=>`${i===5?'<div class="nav-rule"></div>':''}<button data-view="${name.toLowerCase()}" title="${name}" aria-label="${name}"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="${path}"/></svg>${name}</button>`).join('');
let view=new URLSearchParams(location.search).get('view')||'maintenance';let stage='taxi';let filter='All aircraft';
const steps=['Prepare aircraft','Start engines','Taxi to maintenance','Position inside shed','Maintenance check','Return to stand'];
function aircraft(){let repair=stage==='repair';let i=repair?4:2;return `<aside class="drawer surface" aria-label="Selected aircraft"><div class="drawer-head"><div><div class="eyebrow">Selected aircraft</div><h1>VH-PAX</h1><div class="sub">Saab 340B · Coastline Regional</div></div><button class="close" aria-label="Close aircraft details" data-go="overview">×</button></div><div class="drawer-body"><div class="status"><div class="status-title"><span class="dot"></span>${repair?'Under maintenance':'Taxiing to maintenance'}</div><p>${repair?'Parked in bay 02. Engines off. Scheduled maintenance is in progress.':'Following the reserved taxi route.<br>No passengers or cargo on board.'}</p>${repair?'<div class="progress"><i></i></div>':''}</div><div class="details"><div><div class="eyebrow">Destination</div><strong>Regional Express shed</strong></div><div><div class="eyebrow">Assigned bay</div><strong>02 · Nose in</strong></div><div><div class="eyebrow">${repair?'Time remaining':'Ground speed'}</div><strong>${repair?'1 h 12 min':'9 kt'}</strong></div><div><div class="eyebrow">Return estimate</div><strong>14:35 · Adelaide</strong></div></div><ol class="timeline">${steps.map((s,j)=>`<li class="${j<i?'done':j===i?'current':''}">${s}${j===i?'<small>'+ (repair?'Step 5 of 6 · Crew working':'Step 3 of 6 · On route to shed apron')+'</small>':''}</li>`).join('')}</ol></div><div class="drawer-footer"><button class="primary" id="follow">Follow aircraft</button><button class="secondary" id="stage-toggle">${repair?'Preview taxi stage':'Preview repair stage'}</button></div></aside>`}
const fleet=[['VH-PAX','Saab 340B','Maintenance','Regional Express shed','14:35','View maintenance'],['VH-SUN','ATR 42-600','Available','Bay 50D','Now','Plan flight'],['VH-RGN','Dash 8-Q400','Boarding','Bay 50G','Departs 12:28','View plan']];
function workspace(title,sub,body){return `<section class="workspace surface"><div class="workspace-header"><div><div class="eyebrow">Coastline Regional / Adelaide</div><h1>${title}</h1><div class="sub">${sub}</div></div><button class="close" aria-label="Close workspace" data-go="overview">×</button></div>${body}</section>`}
function table(){return `<div class="filters">${['All aircraft','Available','Maintenance'].map(f=>`<button class="${f===filter?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><table class="table"><thead><tr><th>Aircraft</th><th>Activity</th><th>Location</th><th>Availability</th><th></th></tr></thead><tbody>${fleet.filter(r=>filter==='All aircraft'||r[2]===filter).map((r,i)=>`<tr class="${r[0]==='VH-PAX'?'selected':''}"><td><strong>${r[0]}</strong><small>${r[1]}</small></td><td class="${r[2]==='Available'?'ok':''}">${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td><button data-action="${r[0]}">${r[5]}</button></td></tr>`).join('')}</tbody></table><p class="sub" style="margin-top:24px">3 aircraft · 1 available · 1 in maintenance · 1 preparing for departure</p>`}
function render(){document.querySelectorAll('nav button').forEach(b=>{const on=b.dataset.view===view||(view==='maintenance'&&b.dataset.view==='fleet');b.classList.toggle('active',on);b.setAttribute('aria-pressed',on)});let html='';if(view==='maintenance')html=aircraft();else if(view==='fleet')html=workspace('Your fleet','Aircraft availability, assignments and maintenance in one place.',table());else if(view==='operations')html=workspace('Operations','Live movements · Adelaide base',`<div class="filters"><button class="active">Today</button></div><table class="table"><thead><tr><th>Flight / aircraft</th><th>Route</th><th>Activity</th><th>Time</th><th></th></tr></thead><tbody><tr><td><strong>CR146</strong><small>VH-RGN · Dash 8-Q400</small></td><td>Adelaide → Kingscote</td><td>Boarding · 64%</td><td>12:28</td><td><button data-action="VH-RGN">View plan</button></td></tr><tr><td><strong>VH-PAX</strong><small>Saab 340B · Ground movement</small></td><td>Bay 50C → Maintenance</td><td>Taxiing to shed</td><td>Available 14:35</td><td><button data-go="maintenance">Track aircraft</button></td></tr></tbody></table>`);else if(view==='contracts')html=workspace('Contracts','Choose work your fleet can deliver.',`<div class="cards">${[['Kingscote','Regional passenger service','$2,400','Saab 340B or larger'],['Port Lincoln','Regional passenger service','$3,100','ATR 42 or larger'],['Mount Gambier','Freight service','$3,800','Matching freighter required']].map((r,i)=>`<article class="contract"><div class="eyebrow">Adelaide → ${r[0]}</div><h2>${r[1]}</h2><p>${r[3]}<br>Complete 3 rotations<br>Offered payout <span style="color:var(--text)">${r[2]}</span></p><button class="primary" ${i===2?'disabled':''} data-offer="${r[0]}">${i===2?'No eligible aircraft':'Review contract'}</button></article>`).join('')}</div>`);else if(view==='career')html=workspace('Regional beginnings','A clear next step, with useful rewards.',`<div class="cards"><article class="contract"><div class="eyebrow">Current objective · 1 of 3</div><h2>Finish a regional contract</h2><p>Complete your Kingscote rotations.<br>2 of 3 rotations completed.</p><div class="progress"><i style="width:66%"></i></div><button class="primary" data-go="contracts">View contracts</button></article><article class="contract"><div class="eyebrow">Next opportunity</div><h2>Grow your Adelaide base</h2><p>More room for aircraft and local maintenance.<br>Requirements and costs appear here.</p></article></div>`);else if(view==='settings')html=workspace('Settings','Display, audio and camera preferences.',`<div class="filters"><button class="active" id="motion-toggle">Camera vibration: off</button><button id="sound-toggle">Interface sounds: on</button></div><p class="sub">This study demonstrates placement and interaction. Settings do not affect a running game.</p>`);else if(view==='map')html=`<aside class="drawer surface"><div class="drawer-head"><div><div class="eyebrow">Airport map</div><h1>Adelaide</h1></div><button class="close" aria-label="Close map" data-go="overview">×</button></div><p class="sub">Illustrative airfield plan. Select an aircraft to see its route and current activity.</p><div class="status"><div class="status-title"><span class="dot"></span>VH-PAX · Maintenance</div><p>Bay 50C → Regional Express shed</p></div><button class="primary" data-go="maintenance">View aircraft</button></aside>`;document.querySelector('#content').innerHTML=html;document.querySelector('.objective').style.display=['fleet','operations','contracts','career','settings'].includes(view)?'none':'flex';document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>b.dataset.action==='VH-PAX'?go('maintenance'):notice(`${b.dataset.action}: planning details are outside this visual study.`));document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>notice(`${b.dataset.offer}: contract review would open here.`));const toggle=document.querySelector('#stage-toggle');if(toggle)toggle.onclick=()=>{stage=stage==='taxi'?'repair':'taxi';render()};const follow=document.querySelector('#follow');if(follow)follow.onclick=()=>notice('Follow view selected. This study has an illustrative static airfield.');['motion-toggle','sound-toggle'].forEach(id=>{let b=document.getElementById(id);if(b)b.onclick=()=>{b.textContent=b.textContent.endsWith('off')?b.textContent.replace('off','on'):b.textContent.replace('on','off')}})}
function go(v){view=v;document.querySelector('.notice')?.remove();render()}
function notice(s){document.querySelector('.notice')?.remove();let el=document.createElement('div');el.className='notice';el.setAttribute('role','status');el.textContent=s;document.body.append(el)}
